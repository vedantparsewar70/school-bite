services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolbite-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-super-secure-school-mealbox-jwt-secret-key-2026}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-school-bite-91432}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - FIREBASE_SERVICE_ACCOUNT_KEY=${FIREBASE_SERVICE_ACCOUNT_KEY:-}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-SchoolBite}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@school.com}
      - STAFF_EMAIL=${STAFF_EMAIL:-staff@school.com}
      - SEED_ON_INIT=${SEED_ON_INIT:-false}

  # Optional: Automatic SSL / Reverse Proxy using Caddy
  # To enable with your domain:
  # 1. Put your domain in Caddyfile
  # 2. Run: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    container_name: schoolbite-caddy
    restart: unless-stopped
    profiles:
      - https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
